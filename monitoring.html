<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Harian - ASD Nutrition AI Care</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #3b5bdb; --navy: #12224a; --text-dark: #1f2937;
            --text-gray: #6b7280; --border: #e5e7eb; --white: #ffffff;
            --bg: #eef1f5; --radius-sm: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background: var(--bg); display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 24px 0; margin: 0;
        }
        .phone {
            width: 390px; max-width: 100vw; background: var(--white);
            border-radius: 36px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative; height: 90vh; max-height: 850px; display: flex; flex-direction: column;
        }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 18px; text-decoration: none; color: var(--text-dark); }
        .page-title { font-size: 22px; color: var(--navy); font-weight: 700; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); padding: 14px 20px; border-radius: 16px; font-size: 13px; font-weight: 600; z-index: 9999; transition: all 0.5s; max-width: 350px; width: 90%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background: #d1fae5; color: #065f46; border: 2px solid #6ee7b7; }
        .toast-error { background: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }
        .toast-warning { background: #fef3c7; color: #92400e; border: 2px solid #fcd34d; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .form-group input, .form-group textarea { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: #f9fafb; color: var(--text-dark); outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(59,91,219,0.1); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #3b5bdb, #4f6ef2); color: white; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
        .info-box { background: #eaf2fb; border-radius: 12px; padding: 14px; margin-bottom: 20px; font-size: 12px; color: #1e40af; line-height: 1.6; }
        .bottomnav { position: absolute; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eef0f3; display: flex; justify-content: space-around; padding: 10px 6px 18px 6px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: #9aa2b1; text-decoration: none; }
        .nav-item.active { color: var(--primary); }
        .nav-item .navic { font-size: 18px; }
        @media (max-width: 420px) { .phone { border-radius: 0; height: 100vh; max-height: 100vh; } }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="phone">
        <div class="main-content">
            <div class="page-header">
                <a href="dashboard.html" class="back-btn">←</a>
                <h1 class="page-title">📋 Monitoring Harian</h1>
            </div>

            <div class="info-box">
                💡 Catat berat badan, tinggi badan, dan hemoglobin si kecil secara rutin untuk memantau pertumbuhannya.
            </div>

            <form id="monitoringForm" onsubmit="saveData(event)">
                <div class="form-group">
                    <label>📅 Tanggal Pencatatan</label>
                    <input type="date" id="tglCatat" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>⚖️ Berat Badan (kg)</label>
                        <input type="number" id="beratBadan" placeholder="22.5" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>📏 Tinggi Badan (cm)</label>
                        <input type="number" id="tinggiBadan" placeholder="118" step="0.1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>🩸 Hemoglobin / Hb (g/dL) - Opsional</label>
                    <input type="number" id="hemoglobin" placeholder="12.5" step="0.1">
                </div>
                
                <button type="submit" class="btn-primary" id="btnSimpan">💾 Simpan Data Monitoring</button>
            </form>
        </div>

        <div class="bottomnav">
            <a href="dashboard.html" class="nav-item"><div class="navic">🏠</div>Beranda</a>
            <a href="history.html" class="nav-item"><div class="navic">📊</div>Riwayat</a>
            <a href="monitoring.html" class="nav-item active"><div class="navic">➕</div>Input</a>
            <a href="konsultasi.html" class="nav-item"><div class="navic">💬</div>Pesan</a>
            <a href="#" class="nav-item" onclick="logout()"><div class="navic">👤</div>Profil</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwnzngmAC5ymBJ0WHMHV6P_X29zuNqWDWPqN5Bxt3PFdAC3GEZYyXASx0bXk7wGTSmW/exec';
        const session = JSON.parse(localStorage.getItem('asd_nutrition_session') || '{}');
        if (!session.userId) { window.location.href = 'index.html'; }
        document.getElementById('tglCatat').valueAsDate = new Date();

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast toast-' + type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function saveData(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSimpan');
            
            const data = {
                action: 'saveMonitoring',
                userId: session.userId,
                token: session.token || '',
                tgl_catat: document.getElementById('tglCatat').value,
                berat_badan: document.getElementById('beratBadan').value,
                tinggi_badan: document.getElementById('tinggiBadan').value,
                hb: document.getElementById('hemoglobin').value || '0',
                skor_idds: 0,
                total_kalori: 0,
                total_protein: 0,
                total_besi: 0,
                catatan_sensori: '',
                detail_makanan: '[]'
            };

            if (!data.berat_badan || !data.tinggi_badan) {
                showToast('⚠️ BB dan TB wajib diisi!', 'warning');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Menyimpan...';

            try {
                const url = API_URL + '?' + new URLSearchParams(data).toString();
                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    showToast('✅ Data berhasil disimpan! 💜', 'success');
                    document.getElementById('monitoringForm').reset();
                    document.getElementById('tglCatat').valueAsDate = new Date();
                } else {
                    showToast('❌ ' + (result.message || 'Gagal'), 'error');
                }
            } catch (error) {
                let local = JSON.parse(localStorage.getItem('monitoring_local') || '[]');
                local.push({ ...data, timestamp: new Date().toISOString() });
                localStorage.setItem('monitoring_local', JSON.stringify(local));
                showToast('⚠️ Offline. Data disimpan lokal.', 'warning');
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 Simpan Data Monitoring';
            }
        }

        function logout() {
            localStorage.removeItem('asd_nutrition_session');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
