<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keragaman Pangan - ASD Nutrition AI Care</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #3b5bdb; --navy: #12224a; --text-dark: #1f2937;
            --text-gray: #6b7280; --border: #e5e7eb; --white: #ffffff;
            --bg: #eef1f5; --radius-sm: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background: var(--bg); display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 24px 0; margin: 0;
        }
        .phone {
            width: 390px; max-width: 100vw; background: var(--white);
            border-radius: 36px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative; height: 90vh; max-height: 850px; display: flex; flex-direction: column;
        }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 18px; text-decoration: none; color: var(--text-dark); }
        .page-title { font-size: 22px; color: var(--navy); font-weight: 700; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); padding: 14px 20px; border-radius: 16px; font-size: 13px; font-weight: 600; z-index: 9999; transition: all 0.5s; max-width: 350px; width: 90%; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background: #d1fae5; color: #065f46; border: 2px solid #6ee7b7; }
        .toast-warning { background: #fef3c7; color: #92400e; border: 2px solid #fcd34d; }
        .quick-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 16px 0; }
        .quick-item { border-radius: 14px; padding: 12px 8px; text-align: center; }
        .quick-item.kalori{background:#fdf3e3;} .quick-item.skor{background:#f2edfb;} .quick-item.target{background:#eaf2fb;}
        .quick-val { font-size: 20px; font-weight: 800; color: var(--navy); }
        .quick-lbl { font-size: 10px; color: var(--text-gray); margin-top: 2px; }
        .sesi-section { margin-bottom: 16px; }
        .sesi-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .sesi-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .sesi-icon.sarapan{background:#e8f7ec; color:#4caf50;} .sesi-icon.siang{background:#fdf3e3; color:#f5a623;}
        .sesi-icon.malam{background:#eaf2fb; color:#3b82f6;} .sesi-icon.camilan{background:#fdeaf1; color:#ec4899;}
        .sesi-title { font-size: 14px; font-weight: 700; color: var(--navy); }
        .sesi-cal { font-size: 11px; color: var(--text-gray); margin-left: auto; }
        .sesi-buttons { display: flex; gap: 6px; }
        .btn-photo, .btn-gallery { flex: 1; padding: 12px; border: 2px solid #3b5bdb; border-radius: 12px; background: #e8edff; cursor: pointer; font-size: 11px; font-weight: 600; color: #3b5bdb; font-family: inherit; text-align: center; }
        .add-btn { width: 100%; padding: 12px; border: 2px dashed #cbd5e1; border-radius: 12px; background: #f9fafb; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-gray); font-family: inherit; margin-top: 6px; }
        .food-entry { background: #f9fafb; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-top: 8px; border: 1px solid var(--border); }
        .food-entry-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #e8f7ec; flex-shrink: 0; }
        .food-entry-info { flex: 1; }
        .food-entry-name { font-size: 13px; font-weight: 600; }
        .food-entry-detail { font-size: 10px; color: var(--text-gray); }
        .food-entry-remove { width: 28px; height: 28px; border-radius: 50%; border: none; background: #fee2e2; color: #ef4444; cursor: pointer; font-size: 14px; }
        .status-badge { font-size: 9px; padding: 3px 8px; border-radius: 10px; font-weight: 700; }
        .status-badge.habis { background: #d1fae5; color: #065f46; }
        .status-badge.sebagian { background: #fef3c7; color: #92400e; }
        .status-badge.ditolak { background: #fee2e2; color: #991b1b; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .form-group textarea { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: #f9fafb; outline: none; resize: vertical; min-height: 80px; }
        .form-group textarea:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(59,91,219,0.1); }
        .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #3b5bdb, #4f6ef2); color: white; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; border-radius: 24px 24px 0 0; padding: 24px; width: 100%; max-width: 390px; max-height: 75vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 18px; font-weight: 700; color: var(--navy); }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; }
        .search-box { display: flex; align-items: center; gap: 8px; background: #f3f4f6; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
        .search-box input { flex: 1; border: none; background: transparent; font-size: 14px; outline: none; font-family: inherit; }
        .food-option { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; cursor: pointer; }
        .food-option:hover { background: #f3f4f6; }
        .candidate-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
        .candidate-item.selected { border-color: #4caf50; background: #e8f7ec; }
        .candidate-check { font-size: 22px; color: #cbd5e1; }
        .candidate-item.selected .candidate-check { color: #4caf50; }
        .porsi-btn, .kondisi-btn { padding: 10px 16px; border: 2px solid var(--border); border-radius: 20px; background: #f9fafb; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-gray); font-family: inherit; }
        .porsi-btn.selected { border-color: #3b5bdb !important; background: #3b5bdb !important; color: white !important; }
        .kondisi-btn.selected-habis { border-color: #4caf50 !important; background: #4caf50 !important; color: white !important; }
        .kondisi-btn.selected-sebagian { border-color: #f5a623 !important; background: #f5a623 !important; color: white !important; }
        .kondisi-btn.selected-ditolak { border-color: #ef4444 !important; background: #ef4444 !important; color: white !important; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; flex-direction: column; gap: 16px; }
        .loading-overlay.active { display: flex; }
        .loading-spinner { width: 60px; height: 60px; border: 5px solid #f3f4f6; border-top-color: #3b5bdb; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: white; font-size: 14px; font-weight: 600; }
        .bottomnav { position: absolute; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eef0f3; display: flex; justify-content: space-around; padding: 10px 6px 18px 6px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: #9aa2b1; text-decoration: none; }
        .nav-item.active { color: var(--primary); }
        .nav-item .navic { font-size: 18px; }
        @media (max-width: 420px) { .phone { border-radius: 0; height: 100vh; max-height: 100vh; } }
    </style>
</head>

            t.className = 'toast toast-' + type + ' show';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }
        function showLoading(text) { document.getElementById('loadingText').textContent = text; document.getElementById('loadingOverlay').classList.add('active'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

        function hitungGizi(food, berat) {
            const bdd = food.bdd || 100;
            return { energi:(berat/100)*food.energi*(bdd/100), protein:(berat/100)*food.protein*(bdd/100), lemak:(berat/100)*food.lemak*(bdd/100), kh:(berat/100)*food.kh*(bdd/100) };
        }
        function getKelompok(kategori) {
            const m = {'serealia':1,'umbi':2,'kacang':3,'hewani':4,'sayur':5,'buah':5,'minyak':6,'susu':4,'gula':8};
            return m[kategori] || 9;
        }
        function hitungSkor() {
            const semua = [...state.sarapan,...state.siang,...state.malam,...state.camilan];
            const k = new Set();
            semua.forEach(item => { if(item.status!=='ditolak') k.add(getKelompok(item.food.kategori)); });
            return k.size;
        }
        function hitungTotal() {
            const semua = [...state.sarapan,...state.siang,...state.malam,...state.camilan];
            const total = {energi:0, protein:0, lemak:0, kh:0};
            semua.forEach(item => { if(item.status!=='ditolak'){ const g=hitungGizi(item.food,item.berat); Object.keys(total).forEach(k=>total[k]+=g[k]); } });
            return total;
        }
        function updateUI() {
            const total = hitungTotal();
            const skor = hitungSkor();
            document.getElementById('totalKalori').textContent = Math.round(total.energi);
            document.getElementById('skorPPH').textContent = skor + '/9';
            document.getElementById('persenTarget').textContent = Math.round((total.energi/1650)*100) + '%';
            updateSesi('sarapan'); updateSesi('siang'); updateSesi('malam'); updateSesi('camilan');
        }
        function updateSesi(sesi) {
            const items = state[sesi];
            const cal = items.reduce((sum,item)=>{ if(item.status==='ditolak') return sum; return sum + hitungGizi(item.food,item.berat).energi; },0);
            const idMap = {sarapan:'calSarapan', siang:'calSiang', malam:'calMalam', camilan:'calCamilan'};
            const listMap = {sarapan:'listSarapan', siang:'listSiang', malam:'listMalam', camilan:'listCamilan'};
            document.getElementById(idMap[sesi]).textContent = Math.round(cal) + ' kkal';
            let html = '';
            items.forEach((item,i)=>{
                const g = hitungGizi(item.food,item.berat);
                const sl = item.status==='habis'?'Habis':item.status==='sebagian'?'Sebagian':'Ditolak';
                const tag = item.dariFoto ? '📸 ' : '';
                html += `<div class="food-entry"><div class="food-entry-icon">${item.food.icon}</div><div class="food-entry-info"><div class="food-entry-name">${tag}${item.food.nama}</div><div class="food-entry-detail">${item.berat}g • ${Math.round(g.energi)} kkal</div></div><span class="status-badge ${item.status}">${sl}</span><button class="food-entry-remove" onclick="removeFood('${sesi}',${i})">✕</button></div>`;
            });
            document.getElementById(listMap[sesi]).innerHTML = html;
        }

        function openCamera(sesi) { currentSesi = sesi; document.getElementById('cameraInput_'+sesi).click(); }
        function openGallery(sesi) { currentSesi = sesi; document.getElementById('galleryInput_'+sesi).click(); }
        function fileToBase64(file) { return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
        function resizeImage(file,maxSize,quality) {
            return new Promise((resolve,reject)=>{
                const reader=new FileReader();
                reader.onload=function(e){
                    const img=new Image();
                    img.onload=function(){
                        let w=img.width,h=img.height;
                        if(w>h&&w>maxSize){h=Math.round(h*maxSize/w);w=maxSize;}
                        else if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize;}
                        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
                        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
                        resolve(canvas.toDataURL('image/jpeg',quality));
                    };
                    img.onerror=reject;img.src=e.target.result;
                };
                reader.onerror=reject;reader.readAsDataURL(file);
            });
        }

        async function handleFoodPhoto(file, sesi) {
            if(!file) return;
            currentSesi = sesi;
            selectedCandidates.clear();
            showLoading('🔍 AI mendeteksi makanan...');
            try {
                const resizedBase64 = await resizeImage(file, 500, 0.7);
                const detectedFoods = await detectFoodWithVision(resizedBase64);
                hideLoading();
                if(detectedFoods.length===0){ showToast('⚠️ Tidak ada makanan terdeteksi. Cari manual ya.','warning'); return; }
                detectedFoodsData = detectedFoods;
                showDetectionResults(detectedFoods);
            } catch(error) {
                hideLoading();
                showToast('⚠️ Deteksi gagal. Cari manual ya.','warning');
            }
        }

        async function detectFoodWithVision(base64Image) {
            const clean = base64Image.replace(/^data:image\/\w+;base64,/,'');
            const body = { requests:[{ image:{content:clean}, features:[{type:'LABEL_DETECTION',maxResults:20}] }] };
            const res = await fetch(VISION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!res.ok) throw new Error('Vision error '+res.status);
            const result = await res.json();
            return parseVisionResult(result);
        }

        function parseVisionResult(result) {
            const detected = [];
            const seen = new Set();
            if(result.responses && result.responses[0] && result.responses[0].labelAnnotations) {
                result.responses[0].labelAnnotations.forEach(label => {
                    if(!isFoodLabel(label.description)) return;
                    if(label.score < 0.6) return;
                    const simple = label.description.toLowerCase().replace(/[^a-z]/g,'');
                    if(seen.has(simple)) return;
                    seen.add(simple);
                    const tkpiMatch = matchWithTKPI(label.description);
                    detected.push({ detectedName:label.description, confidence:Math.round(label.score*100), tkpiFood:tkpiMatch, matched:!!tkpiMatch });
                });
            }
            return detected.slice(0,10);
        }

        function isFoodLabel(label) {
            const keywords = ['food','rice','chicken','meat','vegetable','fruit','egg','fish','noodle','bread','soup','dish','meal','banana','apple','orange','spinach','carrot','broccoli','tofu','tempeh','beef','potato','pasta'];
            return keywords.some(k => label.toLowerCase().includes(k));
        }

        function matchWithTKPI(label) {
            const lower = label.toLowerCase().trim();
            const mapping = {
                'rice':'SR01','white rice':'SR01','fried rice':'SR02','porridge':'SR03','congee':'SR03',
                'bread':'SR04','toast':'SR04','noodle':'SR05','noodles':'SR05','spaghetti':'SR05','pasta':'SR05',
                'potato':'UB01','french fries':'UB02','fries':'UB02','tempeh':'KK01','tofu':'KK02',
                'chicken':'PH01','fried chicken':'PH01','chicken breast':'PH02','egg':'PH03','boiled egg':'PH03',
                'omelette':'PH04','omelet':'PH04','fish':'PH05','seafood':'PH05','beef':'PH06','meat':'PH06','steak':'PH06',
                'liver':'PH07','spinach':'SY01','leaf vegetable':'SY01','vegetable':'SY01','carrot':'SY02',
                'broccoli':'SY03','water spinach':'SY04','tomato':'SY05','cucumber':'SY05',
                'banana':'BH01','orange':'BH02','citrus':'BH02','apple':'BH03','papaya':'BH04','mango':'BH05',
                'milk':'SS01','dairy':'SS01','yogurt':'SS02','yoghurt':'SS02','cheese':'SS03'
            };
            for(const [key,kode] of Object.entries(mapping)) {
                if(lower.includes(key) || key.includes(lower)) return TKPI_DB.find(f=>f.kode===kode)||null;
            }
            return null;
        }

        function showDetectionResults(foods) {
            const container = document.getElementById('detectionResults');
            let html = `<p style="font-size:12px;color:var(--text-gray);margin-bottom:12px;">🤖 AI mendeteksi <strong>${foods.length} kandidat</strong>. Klik makanan yang benar:</p>`;
            foods.forEach((food,index)=>{
                if(food.matched){
                    html += `<div class="candidate-item" id="cand_${index}" onclick="toggleCandidate(${index})"><span style="font-size:24px;">${food.tkpiFood.icon}</span><div style="flex:1;"><div style="font-size:13px;font-weight:600;">${food.tkpiFood.nama}</div><div style="font-size:10px;color:var(--text-gray);">"${food.detectedName}" (${food.confidence}%)</div></div><span class="candidate-check" id="check_${index}">○</span></div>`;
                }
            });
            html += `<p style="font-size:11px;color:var(--text-gray);margin-top:12px;">👆 Klik untuk centang.</p>`;
            container.innerHTML = html;
            document.getElementById('detectionModal').classList.add('active');
        }

        function toggleCandidate(index) {
            const el = document.getElementById('cand_'+index);
            const check = document.getElementById('check_'+index);
            if(selectedCandidates.has(index)) {
                selectedCandidates.delete(index);
                el.classList.remove('selected');
                check.textContent = '○';
            } else {
                selectedCandidates.add(index);
                el.classList.add('selected');
                check.textContent = '✓';
            }
        }
        function closeDetectionModal() { selectedCandidates.clear(); document.getElementById('detectionModal').classList.remove('active'); }
        function confirmAddDetected() {
            if(selectedCandidates.size===0){ showToast('⚠️ Pilih dulu makanan yang benar ya 😊','warning'); return; }
            let added=0;
            selectedCandidates.forEach(index=>{
                const food = detectedFoodsData[index];
                if(food && food.matched && food.tkpiFood) {
                    state[currentSesi].push({ food:food.tkpiFood, berat:100, status:'habis', sesi:currentSesi, dariFoto:true });
                    added++;
                }
            });
            selectedCandidates.clear();
            closeDetectionModal();
            updateUI();
            if(added>0) showToast('✅ '+added+' makanan ditambahkan!','success');
        }

        function openSearch(sesi) { currentSesi=sesi; document.getElementById('searchInput').value=''; document.getElementById('searchModal').classList.add('active'); filterFoods(); }
        function closeSearchModal() { document.getElementById('searchModal').classList.remove('active'); }
        function filterFoods() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = TKPI_DB.filter(f=>f.nama.toLowerCase().includes(q));
            let html='';
            filtered.forEach(food=>{ html += `<div class="food-option" onclick="selectFood('${food.kode}')"><span style="font-size:20px;">${food.icon}</span><div style="flex:1;"><div style="font-size:13px;font-weight:600;">${food.nama}</div><div style="font-size:10px;color:var(--text-gray);">${food.kategori}</div></div><span style="font-size:10px;color:#3b82f6;">${food.energi} kkal</span></div>`; });
            document.getElementById('foodListContainer').innerHTML = html || '<p style="text-align:center;color:#9ca3af;padding:20px;">Tidak ditemukan</p>';
        }

        function selectFood(kode) {
            selectedFood = TKPI_DB.find(f=>f.kode===kode);
            closeSearchModal();
            document.getElementById('selectedFoodIcon').textContent=selectedFood.icon;
            document.getElementById('selectedFoodName').textContent=selectedFood.nama;
            document.getElementById('selectedFoodCat').textContent=selectedFood.kategori;
            document.getElementById('weightInput').value=100;
            document.querySelectorAll('.porsi-btn').forEach(b=>{b.classList.remove('selected');if(b.dataset.gram==='100')b.classList.add('selected');});
            selectedStatus='habis';
            document.querySelectorAll('.kondisi-btn').forEach(b=>{b.classList.remove('selected-habis','selected-sebagian','selected-ditolak');if(b.dataset.kondisi==='habis')b.classList.add('selected-habis');});
            document.getElementById('weightModal').classList.add('active');
        }
        function closeWeightModal(){document.getElementById('weightModal').classList.remove('active');}
        function setPorsi(gram,btn){document.getElementById('weightInput').value=gram;document.querySelectorAll('.porsi-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}
        function setKondisi(kondisi,btn){selectedStatus=kondisi;document.querySelectorAll('.kondisi-btn').forEach(b=>b.classList.remove('selected-habis','selected-sebagian','selected-ditolak'));btn.classList.add('selected-'+kondisi);}
        function confirmAddFood(){
            const berat=parseFloat(document.getElementById('weightInput').value);
            if(!berat||berat<=0){showToast('⚠️ Isi jumlah ya 😊','warning');return;}
            if(!selectedFood||!currentSesi)return;
            state[currentSesi].push({food:selectedFood,berat,status:selectedStatus,sesi:currentSesi});
            closeWeightModal();updateUI();showToast('✅ '+selectedFood.nama+' ditambahkan!','success');
        }
        function removeFood(sesi,index){state[sesi].splice(index,1);updateUI();showToast('🗑️ Dihapus','warning');}

        async function saveKeragaman() {
            const total = hitungTotal();
            const skor = hitungSkor();
            const data = {
                action: 'saveMonitoring',
                userId: session.userId,
                token: session.token || '',
                tgl_catat: new Date().toISOString().split('T')[0],
                berat_badan: 0,
                tinggi_badan: 0,
                hb: 0,
                skor_idds: skor,
                total_kalori: Math.round(total.energi),
                total_protein: Math.round(total.protein * 10) / 10,
                total_besi: 0,
                catatan_sensori: document.getElementById('catatanSensori').value,
                detail_makanan: JSON.stringify([...state.sarapan, ...state.siang, ...state.malam, ...state.camilan])
            };
            try {
                const url = API_URL + '?' + new URLSearchParams(data).toString();
                const response = await fetch(url);
                const result = await response.json();
                if(result.success) { showToast('✅ Data keragaman tersimpan! 💜','success'); Object.keys(state).forEach(k=>state[k]=[]); document.getElementById('catatanSensori').value=''; updateUI(); }
                else { showToast('❌ ' + (result.message || 'Gagal'), 'error'); }
            } catch(error) {
                showToast('⚠️ Offline. Tersimpan lokal.','warning');
            }
        }

        function logout(){localStorage.removeItem('asd_nutrition_session');window.location.href='index.html';}

        updateUI();
        console.log('✅ Keragaman Pangan ready (dengan Catatan Sensori)');
    </script>
